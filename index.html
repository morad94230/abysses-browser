<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abysses — Moteur de recherche décentralisé</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a1a;
            color: #e0e0ff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Particules flottantes (plancton) */
        .plankton {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00d4ff;
            border-radius: 50%;
            opacity: 0.4;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Conteneur principal */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        /* La pieuvre SVG */
        .octopus-container {
            position: relative;
            width: 320px;
            height: 200px;
            animation: floaty 6s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.35));
        }

        @keyframes floaty {
            0%,100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .octopus-container svg { width: 100%; height: 100%; }

        /* Tentacles animation - utilise transform sur chaque groupe */
        .tentacle {
            transform-origin: 50% 10%;
            animation: tentacle 3.6s ease-in-out infinite;
        }
        .tentacle.t1 { animation-delay: 0s; }
        .tentacle.t2 { animation-delay: 0.2s; }
        .tentacle.t3 { animation-delay: 0.4s; }
        .tentacle.t4 { animation-delay: 0.6s; }
        .tentacle.t5 { animation-delay: 0.8s; }
        .tentacle.t6 { animation-delay: 1s; }
        .tentacle.t7 { animation-delay: 1.2s; }
        .tentacle.t8 { animation-delay: 1.4s; }

        @keyframes tentacle {
            0% { transform: rotate(0deg) translateY(0px); }
            25% { transform: rotate(-8deg) translateY(-6px) ; }
            50% { transform: rotate(0deg) translateY(-12px); }
            75% { transform: rotate(8deg) translateY(-6px); }
            100% { transform: rotate(0deg) translateY(0px); }
        }

        /* Titre */
        .title {
            font-size: 4em;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #00d4ff 0%, #003366 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.5));
        }

        .subtitle {
            font-size: 1em;
            letter-spacing: 6px;
            color: #ff0044;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Barre de recherche */
        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 60px 18px 25px;
            background: rgba(10, 10, 30, 0.9);
            border: 2px solid #1a1a4e;
            border-radius: 50px;
            color: #e0e0ff;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 212, 255, 0.05);
        }

        .search-input::placeholder { color: #334466; }

        .search-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #00d4ff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .search-button:hover { background: #ff0044; box-shadow: 0 0 30px rgba(255, 0, 68, 0.5); }
        .search-button svg { width: 20px; height: 20px; fill: #0a0a1a; }

        /* Stats */
        .stats { display: flex; gap: 40px; font-size: 0.9em; color: #445566; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 1.8em; font-weight: 700; color: #00d4ff; font-family: monospace; }
        .stat-label { font-size: 0.8em; letter-spacing: 2px; }

        /* Footer */
        .footer { position: absolute; bottom: 30px; font-size: 0.75em; color: #334466; letter-spacing: 2px; }
        .footer a { color: #00d4ff; text-decoration: none; }
        .footer a:hover { color: #ff0044; }

        /* Responsive */
        @media (max-width: 600px) {
            .title { font-size: 2.4em; }
            .octopus-container { width: 240px; height: 160px; }
            .stats { gap: 20px; }
            .search-input { padding: 15px 50px 15px 18px; font-size: 0.95em; }
        }
    </style>
</head>
<body>

    <!-- Particules de plancton -->
    <script>
        for (let i = 0; i < 50; i++) {
            const plank = document.createElement('div');
            plank.className = 'plankton';
            plank.style.left = Math.random() * 100 + '%';
            plank.style.animationDuration = (Math.random() * 10 + 8) + 's';
            plank.style.animationDelay = (Math.random() * 10) + 's';
            plank.style.width = (Math.random() * 4 + 2) + 'px';
            plank.style.height = plank.style.width;
            plank.style.opacity = Math.random() * 0.5 + 0.1;
            document.body.appendChild(plank);
        }
    </script>

    <div class="main-container">

        <!-- Pieuvre des abysses en SVG -->
        <div class="octopus-container">
            <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg" aria-label="Pieuvre des abysses">
                <defs>
                    <radialGradient id="headGrad" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stop-color="#6fefff" stop-opacity="0.95" />
                        <stop offset="60%" stop-color="#00425a" stop-opacity="0.95" />
                        <stop offset="100%" stop-color="#001021" stop-opacity="0.95" />
                    </radialGradient>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="6" result="coloredBlur" />
                        <feMerge>
                          <feMergeNode in="coloredBlur" />
                          <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- Tentacles (groups with paths) -->
                <g transform="translate(180,110)">
                    <g class="tentacle t1" transform="rotate(120)">
                        <path d="M0,0 C-8,20 -18,50 -6,82 C2,100 -6,128 8,150" stroke="#003b4f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M0,0 C-6,16 -14,42 -4,68 C1,84 -4,108 6,126" stroke="#00d4ff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.25"/>
                    </g>

                    <g class="tentacle t2" transform="rotate(100)">
                        <path d="M0,0 C-6,18 -14,46 -2,78 C8,100 2,128 16,148" stroke="#003b4f" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </g>

                    <g class="tentacle t3" transform="rotate(80)">
                        <path d="M0,0 C-4,16 -8,40 4,72 C12,92 8,120 22,140" stroke="#003b4f" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </g>

                    <g class="tentacle t4" transform="rotate(40)">
                        <path d="M0,0 C4,10 12,36 18,64 C22,86 26,114 36,136" stroke="#003b4f" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </g>

                    <g class="tentacle t5" transform="rotate(0)">
                        <path d="M0,0 C6,8 16,32 26,58 C34,80 40,110 50,132" stroke="#003b4f" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </g>

                    <g class="tentacle t6" transform="rotate(-40)">
                        <path d="M0,0 C-6,10 -16,34 -28,60 C-36,82 -44,112 -56,134" stroke="#003b4f" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </g>

                    <g class="tentacle t7" transform="rotate(-80)">
                        <path d="M0,0 C-4,12 -10,36 -18,68 C-24,90 -32,120 -44,142" stroke="#003b4f" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </g>

                    <g class="tentacle t8" transform="rotate(-100)">
                        <path d="M0,0 C-8,22 -20,56 -10,90 C-2,110 -8,132 -18,152" stroke="#003b4f" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </g>

                    <!-- Corps / tête -->
                    <g>
                        <ellipse cx="0" cy="-10" rx="70" ry="52" fill="url(#headGrad)" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
                        <!-- Yeux -->
                        <g transform="translate(-28,-20)">
                            <ellipse cx="0" cy="0" rx="10" ry="14" fill="#0b1220" />
                            <circle cx="-2" cy="-4" r="3" fill="#fff" opacity="0.9" />
                        </g>
                        <g transform="translate(28,-20)">
                            <ellipse cx="0" cy="0" rx="10" ry="14" fill="#0b1220" />
                            <circle cx="-2" cy="-4" r="3" fill="#fff" opacity="0.9" />
                        </g>

                        <!-- Siphon luminance (petit cercle bioluminescent) -->
                        <circle cx="0" cy="8" r="6" fill="#00f0ff" opacity="0.9" />
                    </g>
                </g>

            </svg>
        </div>

        <!-- Titre -->
        <h1 class="title">ABYSSES</h1>
        <p class="subtitle">Moteur de recherche décentralisé</p>

        <!-- Barre de recherche -->
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Explorez les abysses..." id="searchInput" onkeydown="if(event.key==='Enter') search()">
            <button class="search-button" onclick="search()">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.[...]"/></svg>
            </button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">0</div>
                <div class="stat-label">SITES INDEXÉS</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">0</div>
                <div class="stat-label">NŒUDS ACTIFS</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">∞</div>
                <div class="stat-label">LIBERTÉ</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span>Propulsé par <a href="https://github.com/morad94230/abysses-browser">Abysses</a> — You are the network. You are the ocean.</span>
    </div>

    <script>
        function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                // Pour l'instant, redirige vers une recherche simulée
                document.getElementById('searchInput').value = '';
                document.getElementById('searchInput').placeholder = 'Recherche en cours dans les abysses...';
                setTimeout(() => {
                    document.getElementById('searchInput').placeholder = 'Explorez les abysses...';
                    alert('🔍 Recherche Abysses : "' + query + '"\n\nLe moteur de recherche décentralisé explorera bientôt le réseau .abyss.');
                }, 1500);
            }
        }

        // Animation des stats (simulation)
        setInterval(() => {
            const siteCount = document.querySelectorAll('.stat-number')[0];
            const nodeCount = document.querySelectorAll('.stat-number')[1];
            if (siteCount && Math.random() > 0.7) {
                siteCount.textContent = Math.floor(Math.random() * 50 + 10);
            }
            if (nodeCount && Math.random() > 0.7) {
                nodeCount.textContent = Math.floor(Math.random() * 30 + 5);
            }
        }, 5000);
    </script>
</body>
</html>
