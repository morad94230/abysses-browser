<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abysses — Moteur de recherche décentralisé</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a1a;
            color: #e0e0ff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Particules flottantes (plancton) */
        .plankton {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00d4ff;
            border-radius: 50%;
            opacity: 0.4;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Conteneur principal */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        /* La pieuvre SVG */
        .octopus-container {
            position: relative;
            width: 300px;
            height: 300px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            25% { transform: translateY(-15px) rotateZ(2deg); }
            50% { transform: translateY(-25px) rotateZ(-1deg); }
            75% { transform: translateY(-10px) rotateZ(1deg); }
        }

        .octopus-container svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 40px rgba(0, 212, 255, 0.3)) drop-shadow(0 0 20px rgba(255, 0, 68, 0.2));
        }

        /* Animation des tentacules */
        @keyframes tentacle1 {
            0%, 100% { transform: rotate(0deg); transform-origin: 150px 80px; }
            25% { transform: rotate(8deg); }
            50% { transform: rotate(-6deg); }
            75% { transform: rotate(5deg); }
        }

        @keyframes tentacle2 {
            0%, 100% { transform: rotate(0deg); transform-origin: 150px 80px; }
            25% { transform: rotate(-8deg); }
            50% { transform: rotate(6deg); }
            75% { transform: rotate(-5deg); }
        }

        .tentacle-left { animation: tentacle1 4s ease-in-out infinite; }
        .tentacle-right { animation: tentacle2 4s ease-in-out infinite; }

        /* Titre */
        .title {
            font-size: 4em;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #00d4ff 0%, #003366 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.5));
        }

        .subtitle {
            font-size: 1em;
            letter-spacing: 6px;
            color: #ff0044;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Barre de recherche */
        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 60px 18px 25px;
            background: rgba(10, 10, 30, 0.9);
            border: 2px solid #1a1a4e;
            border-radius: 50px;
            color: #e0e0ff;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 212, 255, 0.05);
        }

        .search-input::placeholder {
            color: #334466;
        }

        .search-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #00d4ff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .search-button:hover {
            background: #ff0044;
            box-shadow: 0 0 30px rgba(255, 0, 68, 0.5);
        }

        .search-button svg {
            width: 20px;
            height: 20px;
            fill: #0a0a1a;
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 40px;
            font-size: 0.9em;
            color: #445566;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: 700;
            color: #00d4ff;
            font-family: monospace;
        }

        .stat-label {
            font-size: 0.8em;
            letter-spacing: 2px;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 0.75em;
            color: #334466;
            letter-spacing: 2px;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
        }

        .footer a:hover {
            color: #ff0044;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .title { font-size: 2.4em; }
            .octopus-container { width: 220px; height: 220px; }
            .stats { gap: 20px; }
            .search-input { padding: 15px 50px 15px 18px; font-size: 0.95em; }
        }
    </style>
</head>
<body>

    <!-- Particules de plancton -->
    <script>
        for (let i = 0; i < 50; i++) {
            const plank = document.createElement('div');
            plank.className = 'plankton';
            plank.style.left = Math.random() * 100 + '%';
            plank.style.animationDuration = (Math.random() * 10 + 8) + 's';
            plank.style.animationDelay = (Math.random() * 10) + 's';
            plank.style.width = (Math.random() * 4 + 2) + 'px';
            plank.style.height = plank.style.width;
            plank.style.opacity = Math.random() * 0.5 + 0.1;
            document.body.appendChild(plank);
        }
    </script>

    <div class="main-container">

        <!-- Pieuvre des abysses en SVG -->
        <div class="octopus-container">
            <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
                <!-- Dégradé -->
                <defs>
                    <radialGradient id="octopusGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#1a3a5e;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#0d1b3e;stop-opacity:1" />
                    </radialGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Tentacule gauche 1 -->
                <g class="tentacle-left">
                    <path d="M 130 80 Q 100 150, 80 240 Q 75 260, 90 280" stroke="#00d4ff" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.8"/>
                    <circle cx="90" cy="280" r="8" fill="#ff0044" opacity="0.6"/>
                </g>

                <!-- Tentacule gauche 2 -->
                <g class="tentacle-left" style="animation-delay: 0.3s;">
                    <path d="M 120 85 Q 70 140, 50 250 Q 45 270, 65 285" stroke="#00d4ff" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.75"/>
                    <circle cx="65" cy="285" r="7" fill="#ff0044" opacity="0.5"/>
                </g>

                <!-- Tentacule gauche 3 -->
                <g class="tentacle-left" style="animation-delay: 0.6s;">
                    <path d="M 135 90 Q 105 160, 110 270 Q 115 285, 135 295" stroke="#00d4ff" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
                    <circle cx="135" cy="295" r="6" fill="#ff0044" opacity="0.4"/>
                </g>

                <!-- Tentacule droite 1 -->
                <g class="tentacle-right">
                    <path d="M 170 80 Q 200 150, 220 240 Q 225 260, 210 280" stroke="#00d4ff" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.8"/>
                    <circle cx="210" cy="280" r="8" fill="#ff0044" opacity="0.6"/>
                </g>

                <!-- Tentacule droite 2 -->
                <g class="tentacle-right" style="animation-delay: 0.3s;">
                    <path d="M 180 85 Q 230 140, 250 250 Q 255 270, 235 285" stroke="#00d4ff" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.75"/>
                    <circle cx="235" cy="285" r="7" fill="#ff0044" opacity="0.5"/>
                </g>

                <!-- Tentacule droite 3 -->
                <g class="tentacle-right" style="animation-delay: 0.6s;">
                    <path d="M 165 90 Q 195 160, 190 270 Q 185 285, 165 295" stroke="#00d4ff" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
                    <circle cx="165" cy="295" r="6" fill="#ff0044" opacity="0.4"/>
                </g>

                <!-- Corps (tête) principal -->
                <ellipse cx="150" cy="70" rx="45" ry="50" fill="url(#octopusGlow)" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>

                <!-- Yeux gauche -->
                <circle cx="135" cy="55" r="10" fill="#00d4ff" opacity="0.9"/>
                <circle cx="135" cy="55" r="6" fill="#0a0a1a"/>
                <circle cx="137" cy="53" r="2.5" fill="#ff0044"/>

                <!-- Yeux droite -->
                <circle cx="165" cy="55" r="10" fill="#00d4ff" opacity="0.9"/>
                <circle cx="165" cy="55" r="6" fill="#0a0a1a"/>
                <circle cx="167" cy="53" r="2.5" fill="#ff0044"/>

                <!-- Bouche (bec) -->
                <circle cx="150" cy="80" r="5" fill="#ff0044" opacity="0.7"/>

                <!-- Détails supplémentaires (veines luminescentes) -->
                <path d="M 140 65 Q 145 70, 140 75" stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.4"/>
                <path d="M 160 65 Q 155 70, 160 75" stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.4"/>

                <!-- Photophores (organes luminescents) -->
                <circle cx="145" cy="75" r="2" fill="#ff0044" opacity="0.8"/>
                <circle cx="155" cy="78" r="2" fill="#ff0044" opacity="0.6"/>
                <circle cx="150" cy="85" r="2" fill="#00d4ff" opacity="0.7"/>
            </svg>
        </div>

        <!-- Titre -->
        <h1 class="title">ABYSSES</h1>
        <p class="subtitle">Moteur de recherche décentralisé</p>

        <!-- Barre de recherche -->
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Explorez les abysses..." id="searchInput" onkeydown="if(event.key==='Enter') search()">
            <button class="search-button" onclick="search()">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">0</div>
                <div class="stat-label">SITES INDEXÉS</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">0</div>
                <div class="stat-label">NŒUDS ACTIFS</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">∞</div>
                <div class="stat-label">LIBERTÉ</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span>Propulsé par <a href="https://github.com/morad94230/abysses-browser">Abysses</a> — You are the network. You are the ocean.</span>
    </div>

    <script>
        function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                // Pour l'instant, redirige vers une recherche simulée
                document.getElementById('searchInput').value = '';
                document.getElementById('searchInput').placeholder = 'Recherche en cours dans les abysses...';
                setTimeout(() => {
                    document.getElementById('searchInput').placeholder = 'Explorez les abysses...';
                    alert('🔍 Recherche Abysses : "' + query + '"\n\nLe moteur de recherche décentralisé explorera bientôt le réseau .abyss.');
                }, 1500);
            }
        }

        // Animation des stats (simulation)
        setInterval(() => {
            const siteCount = document.querySelectorAll('.stat-number')[0];
            const nodeCount = document.querySelectorAll('.stat-number')[1];
            if (siteCount && Math.random() > 0.7) {
                siteCount.textContent = Math.floor(Math.random() * 50 + 10);
            }
            if (nodeCount && Math.random() > 0.7) {
                nodeCount.textContent = Math.floor(Math.random() * 30 + 5);
            }
        }, 5000);
    </script>
</body>
</html>
